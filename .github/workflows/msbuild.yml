name: MSBuild

on:
  push:
    branches: [ "v2" ]
  pull_request:
    branches: [ "v2" ]
    

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release
  VCPKG_DEFAULT_TRIPLET: x86-windows
  VCPKG_INSTALLED_DIR: ./vcpkg_installed/
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2
      
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v10
      with:
        vcpkgGitCommitId: 69efe9cc2df0015f0bb2d37d55acde4a75c9a25b
    - name: Provide 7-Zip for vcpkg
      shell: pwsh
      run: |
        $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
        $msiDir = Join-Path $vcpkgRoot "downloads\tools\7zip_msi-21.07-windows\Files\7-Zip"
        $exeDir = Join-Path $vcpkgRoot "downloads\tools\7zip-21.07-windows"
        New-Item -ItemType Directory -Force -Path $msiDir, $exeDir | Out-Null
        Copy-Item "C:\Program Files\7-Zip\*" $msiDir -Recurse -Force
        Copy-Item "C:\Program Files\7-Zip\7z.exe" (Join-Path $exeDir "7za.exe") -Force
        Copy-Item "C:\Program Files\7-Zip\7z.dll" (Join-Path $exeDir "7z.dll") -Force
    - name: Install vcpkg dependencies
      run: ./InstallDependencies.bat
    - name: Install NPM packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: cd ./src/js-framework ; npm i

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild .\BetterNCMII.sln -p:Platform="All" -p:Configuration=Release

    - uses: "marvinpinto/action-automatic-releases@latest"
      name: Upload to Github Release
      if: github.event_name != 'pull_request'
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "dev-nightly"
        prerelease: true
        title: "Latest Test Release"
        files: |
          ${{ github.workspace }}/x64/Release/BetterNCMII.dll
          ${{ github.workspace }}/Release_86/BetterNCMII86.dll

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BetterNCMII
        path: |
          ${{ github.workspace }}/x64/Release/BetterNCMII.dll
          ${{ github.workspace }}/Release_86/BetterNCMII86.dll
        

